[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdf-works"
version = "5.0.0b1"
description = "Native PDF editor and ROI workbench for Windows (beta)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.7", "PyMuPDF>=1.24.2"]
dev = ["pytest>=8", "ruff>=0.6", "PyMuPDF>=1.24.2"]

[project.scripts]
pdf-works = "pdf_works.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_works"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# Locally installed font files are ignored by Git; include them in a built wheel
# after running scripts/install_fonts.py and verifying the OFL notice.
[tool.hatch.build.targets.wheel.force-include]
"src/pdf_works/resources/fonts" = "pdf_works/resources/fonts"
