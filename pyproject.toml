[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pdf-works"
version = "0.0.0"
description = "Lightweight Windows PDF workbench (scaffold only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Planned UI/PDF stack; optional to avoid heavy installation during scaffold stage.
desktop = ["PySide6>=6.7", "PyMuPDF>=1.24"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_works"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
